[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchin"
version = "0.1.0"
description = "Pitch in — the free coding agent. Everyone brings a model; nobody pays."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai-agent", "coding-agent", "llm", "free", "open-weight"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
pitchin = "pitchin.cli:main"

[project.urls]
Homepage = "https://github.com/robinaider/pitchin"
Issues = "https://github.com/robinaider/pitchin/issues"

[tool.setuptools.packages.find]
where = ["src"]
